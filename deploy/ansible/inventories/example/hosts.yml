---
# Example inventory: one x86 OpenShift cluster and one OpenShift-on-IBM-Z cluster.
# Every cluster is an Ansible host (connection=local); `serial: 1` in site.yml rolls them out
# one after the other in this order (x86 first = canary, then Z).
# A single heterogeneous cluster with both x86 and s390x workers is just one host here.
all:
  children:
    pipeline:
      hosts:
        localhost:
          ansible_connection: local
    openshift_clusters:
      hosts:
        ocp-x86:
          ansible_connection: local
        ocp-z:
          ansible_connection: local
    # Host that has the Db2 CLP installed (same as ./build.sh db2-deploy). Optional.
    db2_admin:
      hosts: {}
        # db2admin.dlis.internal:
        #   ansible_user: db2inst1
